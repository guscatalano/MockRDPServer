name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MockRdp.slnx

      - name: Build
        run: dotnet build MockRdp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MockRdp.slnx -c Release --no-build --verbosity normal

  real-clients:
    name: Real clients vs. the mock (FreeRDP + mstscax)
    runs-on: windows-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install FreeRDP (wfreerdp)
        shell: pwsh
        run: choco install -y --no-progress freerdp.portable

      # Tier 2, client #1: FreeRDP (headless CLI). run-checkpoint.ps1 builds + starts the mock,
      # drives wfreerdp against it, and asserts the connection reached the ACTIVE stage.
      - name: FreeRDP checkpoint → ACTIVE
        shell: pwsh
        run: ./scripts/run-checkpoint.ps1 -Port 33461 -ExpectStage active -TimeoutSec 25

      # Tier 2, client #2: the mstscax ActiveX control — the same protocol/rendering engine that
      # mstsc.exe hosts. (Real mstsc.exe is a GUI with no scriptable success signal, so it can't be
      # asserted on a headless runner; the control is the automatable, mstsc-grade equivalent.)
      # It hosts the control, connects over TLS auto-accepting the self-signed cert, and exits 0
      # only if the session reaches ACTIVE.
      - name: mstscax checkpoint (mstsc's engine) → full session
        shell: pwsh
        run: ./tools/RdpAxClient/test-against-mock.ps1 -Port 33462 -TimeoutSec 30

  publish:
    name: Publish mock server (win-x64)
    runs-on: windows-latest
    needs: build-test
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Self-contained single-file exe so RDPeek's integration tests can download and run
      # it as a real DVC-capable RDP target with no .NET runtime on the box.
      - name: Publish MockRdpCli (console)
        run: >
          dotnet publish src/MockRdp -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # The tray app — the run-this entry point. Published to the same folder so a bare
      # MockRdpCli.exe (no args) hands off to MockRdpTray.exe sitting next to it.
      - name: Publish MockRdpTray (GUI)
        run: >
          dotnet publish src/MockRdp.Tray -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mockrdp-win-x64
          path: |
            publish/MockRdpTray.exe
            publish/MockRdpCli.exe
          if-no-files-found: error
